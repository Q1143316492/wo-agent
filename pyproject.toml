[project]
name = "wo-agent"
version = "0.1.0"
description = "Pure Python agent harness aligned with deepseek-harness module split"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm*", "session*", "agent*", "tools*", "skill*", "compose*", "system_prompt*", "compaction*", "workspace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src"]
